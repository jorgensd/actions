name: Install DOLFINx
description: Install DOLFINx from source

inputs:
  dolfinx-repository:
    description: "Repository of DOLFINx"
    required: false
    default: "FEniCS/dolfinx"
  ufl-repository:
    description: "Repository of UFL"
    required: false
    default: "FEniCS/ufl"
  ffcx-repository:
    description: "Repository of UFL"
    required: false
    default: "FEniCS/ffcx"
  basix-repository:
    description: "Repository of Basix"
    required: false
    default: "FEniCS/basix"
  dolfinx:
    description: "Branch of DOLFINx"
    required: false
    default: "main"
  ufl:
    description: "Branch of UFL"
    required: false
    default: "main"
  ffcx:
    description: "Branch of FFCx"
    required: false
    default: "main"
  basix:
    description: "Branch of Basix"
    required: false
    default: "main"
  petsc_dir:
    description: "PETSc Directory"
    required: false
    default: "/usr/local/petsc"
  petsc_arch:
    description: "PETSc Arch"
    required: false
    default: "linux-gnu-real-32"
  build_mode:
    description: "Mode to build Basix and DOLFINx"
    required: false
    default: "Release"
  adios2:
    description: "ADIOS2 version/branch"
    required: false
    default: "default"
  working-directory:
    description: "Working directory"
    required: false
    default: "."

runs:
  using: composite

  steps:
    - name: Get Basix
      uses: actions/checkout@v7
      with:
        path: ${{ inputs.working-directory }}/basix
        repository: ${{ inputs.basix-repository }}
        ref: ${{ inputs.basix }}

    - name: Get DOLFINx
      uses: actions/checkout@v7
      with:
        path: ${{ inputs.working-directory }}/dolfinx
        repository: ${{ inputs.dolfinx-repository }}
        ref: ${{ inputs.dolfinx }}

    - name: Get pip flags based on version
      id: python-version
      shell: bash -el {0}
      run: |
        MODERN_PIP=$(python3 -c "import sys; t = sys.version_info >= (3, 11, 0); sys.stdout.write(str(t))")
        if [ ${MODERN_PIP} == "True" ]; then
          FLAGS="--break-system-packages"
        else
          FLAGS=""
          python3 -m pip install --upgrade pip
        fi
        echo "PYTHON_FLAGS=${FLAGS}" >> "$GITHUB_OUTPUT"
        
    # DOLFINx 0.11.x (release branch) passes a cffi cdata object where the
    # nanobind bindings expect a C++ integer. nanobind 2.14.0 requires the
    # `__index__` protocol for implicit integer conversion, which cffi cdata
    # does not implement, so every `dolfinx.fem.form` call fails with
    # "TypeError: __init__(): incompatible function arguments".
    # Fixed on DOLFINx main by https://github.com/FEniCS/dolfinx/pull/4371,
    # not (yet) backported to the release branch, so constrain nanobind when
    # building the stable bindings. Remove once the fix is in a release.
    - name: Constrain nanobind for stable DOLFINx
      shell: bash -el {0}
      if: ${{ inputs.dolfinx == 'stable' }}
      run: |
        echo "nanobind<2.14" > "$GITHUB_WORKSPACE/constraints.txt"
        echo "PIP_CONSTRAINT=$GITHUB_WORKSPACE/constraints.txt" >> $GITHUB_ENV
    
    - name: Install UFL, Basix, FFCx
      working-directory: ${{ inputs.working-directory }}
      shell: bash -el {0}
      run: |
        cmake -G Ninja -B build-basix -DCMAKE_BUILD_TYPE="Release" -S ./basix/cpp/
        cmake --build build-basix --parallel 2
        cmake --install build-basix
        python3 -m pip install ${{ steps.python-version.outputs.PYTHON_FLAGS }} "nanobind<2.15" scikit-build-core[pyproject] mpi4py
        python3 -m pip -v install ${{ steps.python-version.outputs.PYTHON_FLAGS }} --check-build-dependencies --config-settings=build-dir="build-basix-python" --config-settings=cmake.build-type=${{ inputs.build_mode }} --config-settings=install.strip=false --no-build-isolation ./basix/python
        python3 -m pip install ${{ steps.python-version.outputs.PYTHON_FLAGS }} git+https://github.com/${{ inputs.ufl-repository }}.git@${{ inputs.ufl }}
        python3 -m pip install ${{ steps.python-version.outputs.PYTHON_FLAGS }} git+https://github.com/${{ inputs.ffcx-repository }}.git@${{ inputs.ffcx }}

    - name: Clone ADIOS2
      if: ${{ inputs.adios2 != 'default' }}
      uses: actions/checkout@v7
      with:
        path: ${{ inputs.working-directory }}/adios2
        repository: ornladios/ADIOS2
        ref: ${{ inputs.adios2 }}
        fetch-depth: 0 # Get all commits to apply patch

    - name: Install adios2
      if: ${{ inputs.adios2 != 'default' }}
      working-directory: ${{ inputs.working-directory }}/adios2
      shell: bash -el {0}
      run: |
        VERSION="${{ inputs.adios2 }}"
        VERSION="${VERSION#v}" # Strip 'v' prefix if present

        # Extract major and minor version parts safely
        MAJOR=$(echo "$VERSION" | cut -d. -f1)
        MINOR=$(echo "$VERSION" | cut -d. -f2)

        # Default to a high version number if the input isn't a numeric release (e.g., 'master')
        [[ "$MAJOR" =~ ^[0-9]+$ ]] || MAJOR=999
        [[ "$MINOR" =~ ^[0-9]+$ ]] || MINOR=999

        if [ "$MAJOR" -lt 2 ] || { [ "$MAJOR" -eq 2 ] && [ "$MINOR" -lt 12 ]; }; then
          echo "Version ${{ inputs.adios2 }} is older than 2.12. Applying cherry-pick..."
          git config --global user.email ""
          git config --global user.name "Github Action Runner"
          git cherry-pick dae5a6abb8d09a12cbc7e7af8d206f5c2a985e3b
        else
          echo "Version ${{ inputs.adios2 }} is 2.12 or newer. Skipping cherry-pick."
        fi
        if [ "$MAJOR" -lt 2 ] || { [ "$MAJOR" -eq 2 ] && [ "$MINOR" -lt 13 ]; }; then
          echo "Version ${{ inputs.adios2 }} is older than 2.13. Applying cherry-pick..."
          git config --global user.email ""
          git config --global user.name "Github Action Runner"
          git cherry-pick -m 1 ecf587ce8157bf66b82b8908b864d5e8eff39cda
        else
          echo "Version ${{ inputs.adios2 }} is newer than 2.13. Skipping cherry-pick."
        fi

        PYTHON_SITE_DIR=$(python3 -c "import site; print(site.getsitepackages()[0])")
        echo "Installing Python bindings directly to: $PYTHON_SITE_DIR"

        cmake -G Ninja -DADIOS2_USE_HDF5=on -DHDF5_PREFER_PARALLEL=on -DADIOS2_USE_Python=on -DCMAKE_INSTALL_PYTHONDIR="$PYTHON_SITE_DIR" -DADIOS2_USE_Fortran=off -DBUILD_TESTING=off -DADIOS2_BUILD_EXAMPLES=off -DADIOS2_USE_ZeroMQ=off -DCMAKE_BUILD_TYPE="Release" -B build-dir-adios2 -S .
        cmake --build build-dir-adios2 --parallel 2
        cmake --install build-dir-adios2
        ldconfig

    - name: Configure C++ (DOLFINx)
      working-directory: ${{ inputs.working-directory }}
      shell: bash -el {0}
      run: PETSC_DIR=${{ inputs.petsc_dir }} PETSC_ARCH=${{ inputs.petsc_arch }} cmake -G Ninja -DCMAKE_BUILD_TYPE=${{ inputs.build_mode }} -B build-dolfinx -S ./dolfinx/cpp/

    - name: Build and install C++ library (dolfinx)
      shell: bash -el {0}
      working-directory: ${{ inputs.working-directory }}
      run: |
        cmake --build build-dolfinx
        cmake --install build-dolfinx

    - name: Build Python interface (DOLFINx)
      working-directory: ${{ inputs.working-directory }}/dolfinx/python
      shell: bash -el {0}
      run: |
        python3 -m pip install scikit-build-core
        python3 -m scikit_build_core.build requires | python3 -c "import sys, json; print(' '.join(json.load(sys.stdin)))" | xargs pip install
        PETSC_DIR=${{ inputs.petsc_dir }} PETSC_ARCH=${{ inputs.petsc_arch }} python3 -m pip -v install --check-build-dependencies ${{ steps.python-version.outputs.PYTHON_FLAGS }} --no-build-isolation --no-dependencies  .
